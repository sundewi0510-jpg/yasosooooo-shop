<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin yasosooooo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;background:#fff8fb;padding:16px;color:#333}
main{max-width:650px;margin:auto}
section{background:white;padding:16px;border-radius:12px;margin:12px 0}
input,textarea{box-sizing:border-box;width:100%;padding:12px;margin:6px 0}
button{padding:12px;margin:5px;background:#e98bb8;color:white;border:0;border-radius:8px}
.product{border-top:1px solid #ddd;padding:12px 0}
</style>
</head>
<body>
<main>
<h2>💗 yasosooooo Admin</h2>
<section id="login">
<h3>เข้าสู่ระบบ</h3>
<input id="email" type="email" placeholder="อีเมลแอดมิน">
<input id="password" type="password" placeholder="รหัสผ่าน">
<button id="loginBtn">เข้าสู่ระบบ</button>
<p id="loginMsg"></p>
</section>
<section id="panel" hidden>
<button id="logoutBtn">ออกจากระบบ</button>
<h3>เพิ่ม / แก้ไขสินค้า</h3>
<form id="productForm">
<input id="productId" type="hidden">
<input id="name" placeholder="ชื่อสินค้า" required>
<textarea id="description" placeholder="รายละเอียด"></textarea>
<input id="image_url" type="url" placeholder="ลิงก์รูปสินค้า">
<input id="price" type="number" min="0" step="0.01" placeholder="ราคา" required>
<input id="stock" type="number" min="0" placeholder="จำนวน" required>
<label><input id="active" type="checkbox" checked> แสดงบนหน้าร้าน</label>
<br><button type="submit">บันทึกสินค้า</button>
<button type="button" id="clearBtn">ล้างแบบฟอร์ม</button>
</form>
<p id="msg"></p>
<h3>รายการสินค้า</h3>
<div id="products"></div>
</section>
</main>
<script>
const SUPABASE_URL = 'https://ybjtekjaucpzddjuplsj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_RMiwcgxdgIm-aiReJGIaJg_y6HCe_bD';
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $ = id => document.getElementById(id);

$('loginBtn').onclick = async () => {
 $('loginMsg').textContent='กำลังเข้าสู่ระบบ...';
 const {error}=await db.auth.signInWithPassword({
  email:$('email').value.trim(),password:$('password').value
 });
 if(error){$('loginMsg').textContent=error.message;return;}
 await checkSession();
};

$('logoutBtn').onclick=async()=>{
 await db.auth.signOut();
 $('panel').hidden=true;
 $('login').hidden=false;
};

$('clearBtn').onclick=()=>{$('productForm').reset();$('productId').value='';};

async function checkSession(){
 const {data:{session}}=await db.auth.getSession();
 if(!session){$('panel').hidden=true;$('login').hidden=false;return;}
 const {data:admin,error}=await db.from('admin_users')
  .select('user_id').eq('user_id',session.user.id).maybeSingle();
 if(error||!admin){
  $('loginMsg').textContent='บัญชีนี้ไม่มีสิทธิ์แอดมิน';
  await db.auth.signOut();return;
 }
 $('login').hidden=true;$('panel').hidden=false;
 await loadProducts();
}

async function loadProducts(){
 $('products').textContent='กำลังโหลด...';
 const {data,error}=await db.from('products')
  .select('id,name,description,image_url,price,stock,active')
  .order('id',{ascending:false});
 if(error){$('products').textContent=error.message;return;}
 $('products').replaceChildren();
 if(!data.length){$('products').textContent='ยังไม่มีสินค้า';return;}
 data.forEach(p=>{
  const box=document.createElement('div');box.className='product';
  const title=document.createElement('b');title.textContent=p.name;
  const info=document.createElement('p');
  info.textContent='ราคา '+p.price+' บาท | คงเหลือ '+p.stock+
   ' | '+(p.active?'แสดงหน้าร้าน':'ซ่อน');
  const edit=document.createElement('button');edit.textContent='แก้ไข';
  edit.onclick=()=>{
   $('productId').value=p.id;$('name').value=p.name||'';
   $('description').value=p.description||'';
   $('image_url').value=p.image_url||'';
   $('price').value=p.price;$('stock').value=p.stock;
   $('active').checked=p.active;
   window.scrollTo(0,0);
  };
  const del=document.createElement('button');del.textContent='ลบ';
  del.onclick=async()=>{
   if(!confirm('ยืนยันลบ '+p.name+' ?'))return;
   const {error}=await db.from('products').delete().eq('id',p.id);
   if(error)alert(error.message);else await loadProducts();
  };
  box.append(title,info,edit,del);$('products').append(box);
 });
}

$('productForm').onsubmit=async e=>{
 e.preventDefault();$('msg').textContent='กำลังบันทึก...';
 const item={
  name:$('name').value.trim(),
  description:$('description').value.trim(),
  image_url:$('image_url').value.trim()||null,
  price:Number($('price').value),
  stock:Number($('stock').value),
  active:$('active').checked
 };
 const id=$('productId').value;
 const {error}=id
  ?await db.from('products').update(item).eq('id',id)
  :await db.from('products').insert(item);
 if(error){$('msg').textContent='บันทึกไม่สำเร็จ: '+error.message;return;}
 $('msg').textContent='บันทึกสำเร็จ';
 $('productForm').reset();$('productId').value='';
 $('active').checked=true;await loadProducts();
};

checkSession();
</script>
</body>
</html>
