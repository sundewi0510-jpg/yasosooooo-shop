
<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yasosooooo | ร้านการ์ดและของสะสม</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff9fc;
      color: #493744;
    }
    header {
      padding: 24px 16px;
      text-align: center;
      background: #ffe5f0;
    }
    h1 { margin: 0 0 8px; color: #bd6393; }
    main { max-width: 1000px; margin: auto; padding: 20px 14px; }
    #status { text-align: center; padding: 20px; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 14px;
    }
    .product {
      background: white;
      border: 1px solid #f3dce8;
      border-radius: 14px;
      padding: 12px;
      overflow: hidden;
    }
    .product img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #fff1f7;
    }
    .no-image {
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
      background: #fff1f7;
      border-radius: 10px;
      color: #bd6393;
    }
    .product h3 { font-size: 16px; margin: 10px 0 6px; }
    .description { font-size: 13px; color: #806c7a; }
    .price { font-weight: bold; color: #c0528a; margin: 8px 0; }
    .stock { font-size: 12px; color: #776b73; }
    footer { text-align: center; padding: 25px; color: #9a8190; }
  </style>
</head>
<body>
  <header>
    <h1>yasosooooo</h1>
    <div>ร้านการ์ดและของสะสมแฟนด้อม ♡</div>
  </header>

  <main>
    <h2>สินค้าของเรา</h2>
    <div id="status">กำลังโหลดสินค้า...</div>
    <div class="products" id="products"></div>
  </main>

  <footer>yasosooooo ♡</footer>

  <script>
    // ใส่ค่า Project URL และ Publishable key ของร้านตรงนี้
    const SUPABASE_URL = 'https://ybjtekjaucpzddjuplsj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_RMiwcgxdgIm-aiReJGIaJg_y6HCe_bD';

    const statusBox = document.getElementById('status');
    const productsBox = document.getElementById('products');

    async function loadProducts() {
      if (SUPABASE_URL.includes('ใส่_') ||
          SUPABASE_KEY.includes('ใส่_')) {
        statusBox.textContent =
          'ยังไม่ได้ตั้งค่า Supabase URL และ Publishable key ในไฟล์เว็บ';
        return;
      }

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL, SUPABASE_KEY
        );

        const { data, error } = await client
          .from('products')
          .select('id, name, description, image_url, price, stock')
          .eq('active', true)
          .order('id', { ascending: false });

        if (error) throw error;

        statusBox.textContent = data.length
          ? ''
          : 'ยังไม่มีสินค้าเปิดขาย';

        productsBox.replaceChildren();

        data.forEach(product => {
          const card = document.createElement('article');
          card.className = 'product';

          if (product.image_url) {
            const img = document.createElement('img');
            img.src = product.image_url;
            img.alt = product.name || 'สินค้า';
            img.loading = 'lazy';
            card.appendChild(img);
          } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'no-image';
            placeholder.textContent = '♡ ไม่มีรูปสินค้า ♡';
            card.appendChild(placeholder);
          }

          const name = document.createElement('h3');
          name.textContent = product.name || 'สินค้า';
          card.appendChild(name);

          if (product.description) {
            const desc = document.createElement('div');
            desc.className = 'description';
            desc.textContent = product.description;
            card.appendChild(desc);
          }

          const price = document.createElement('div');
          price.className = 'price';
          price.textContent =
            '฿' + Number(product.price || 0).toLocaleString('th-TH');
          card.appendChild(price);

          const stock = document.createElement('div');
          stock.className = 'stock';
          stock.textContent = Number(product.stock) > 0
            ? 'คงเหลือ ' + product.stock + ' ชิ้น'
            : 'สินค้าหมด';
          card.appendChild(stock);

          productsBox.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        statusBox.textContent =
  'โหลดสินค้าไม่สำเร็จ: ' + (error.message || String(error));
      }
    }

    loadProducts();
  </script>
</body>
</html>
