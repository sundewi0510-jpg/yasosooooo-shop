
<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yasosooooo | ร้านการ์ดและของสะสม</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff9fc;
      color: #493744;
    }
    header {
      padding: 24px 16px;
      text-align: center;
      background: #ffe5f0;
    }
    h1 { margin: 0 0 8px; color: #bd6393; }
    main { max-width: 1000px; margin: auto; padding: 20px 14px; }
    #status { text-align: center; padding: 20px; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 14px;
    }
    .product {
      background: white;
      border: 1px solid #f3dce8;
      border-radius: 14px;
      padding: 12px;
      overflow: hidden;
    }
    .product img, .no-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      background: #fff1f7;
    }
    .no-image {
      display: grid;
      place-items: center;
      color: #bd6393;
    }
    .product h3 { font-size: 16px; margin: 10px 0 6px; }
    .description { font-size: 13px; color: #806c7a; white-space: pre-wrap; }
    .price { font-weight: bold; color: #c0528a; margin: 8px 0; font-size: 18px; }
    .stock { font-size: 12px; color: #776b73; margin: 7px 0; }
    .option-label { display: block; font-size: 13px; margin-top: 12px; }
    .variant-select {
      width: 100%;
      margin-top: 5px;
      padding: 10px 8px;
      border: 1px solid #e8bfd2;
      border-radius: 8px;
      background: white;
      color: #493744;
      font-size: 14px;
    }
    .sold-out { color: #c0528a; font-weight: bold; }
    footer { text-align: center; padding: 25px; color: #9a8190; }
  </style>
</head>
<body>
  <header>
    <h1>yasosooooo</h1>
    <div>ร้านการ์ดและของสะสมแฟนด้อม ♡</div>
  </header>

  <main>
    <h2>สินค้าของเรา</h2>
    <div id="status">กำลังโหลดสินค้า...</div>
    <div class="products" id="products"></div>
  </main>

  <footer>yasosooooo ♡</footer>

  <script>
    const SUPABASE_URL = 'https://ybjtekjaucpzddjuplsj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_RMiwcgxdgIm-aiReJGIaJg_y6HCe_bD';

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const statusBox = document.getElementById('status');
    const productsBox = document.getElementById('products');

    function money(value) {
      return '฿' + Number(value || 0).toLocaleString('th-TH');
    }

    async function loadProducts() {
      try {
        const { data: products, error } = await client
          .from('products')
          .select('id, name, description, image_url, price, stock')
          .eq('active', true)
          .order('id', { ascending: false });

        if (error) throw error;

        productsBox.replaceChildren();

        if (!products || products.length === 0) {
          statusBox.textContent = 'ยังไม่มีสินค้าเปิดขาย';
          return;
        }

        // โหลดตัวเลือกของสินค้าทั้งหมด
        const { data: variants, error: variantError } = await client
          .from('product_variants')
          .select('id, product_id, name, price, stock')
          .eq('active', true)
          .order('id', { ascending: true });

        if (variantError) throw variantError;

        statusBox.textContent = '';

        products.forEach(product => {
          const card = document.createElement('article');
          card.className = 'product';

          if (product.image_url) {
            const img = document.createElement('img');
            img.src = product.image_url;
            img.alt = product.name || 'สินค้า';
            img.loading = 'lazy';
            img.onerror = () => {
              const placeholder = document.createElement('div');
              placeholder.className = 'no-image';
              placeholder.textContent = '♡ โหลดรูปไม่ได้ ♡';
              img.replaceWith(placeholder);
            };
            card.appendChild(img);
          } else {
            const placeholder = document.createElement('div');
            placeholder.className = 'no-image';
            placeholder.textContent = '♡ ไม่มีรูปสินค้า ♡';
            card.appendChild(placeholder);
          }

          const name = document.createElement('h3');
          name.textContent = product.name || 'สินค้า';
          card.appendChild(name);

          if (product.description) {
            const desc = document.createElement('div');
            desc.className = 'description';
            desc.textContent = product.description;
            card.appendChild(desc);
          }

          const productVariants = (variants || []).filter(
            v => String(v.product_id) === String(product.id)
          );

          const price = document.createElement('div');
          price.className = 'price';

          const stock = document.createElement('div');
          stock.className = 'stock';

          function updateDisplay(item) {
            const currentPrice = item ? item.price : product.price;
            const currentStock = item ? item.stock : product.stock;

            price.textContent = money(currentPrice);

            if (Number(currentStock) > 0) {
              stock.textContent = 'คงเหลือ ' +
                Number(currentStock).toLocaleString('th-TH') + ' ชิ้น';
              stock.classList.remove('sold-out');
            } else {
              stock.textContent = 'สินค้าหมด';
              stock.classList.add('sold-out');
            }
          }

          if (productVariants.length > 0) {
            const label = document.createElement('label');
            label.className = 'option-label';
            label.textContent = 'เลือกรูปแบบสินค้า';

            const select = document.createElement('select');
            select.className = 'variant-select';

            productVariants.forEach((variant, index) => {
              const option = document.createElement('option');
              option.value = String(variant.id);
              option.textContent = variant.name + ' — ' +
                money(variant.price) + ' (เหลือ ' +
                Number(variant.stock) + ')';
              option.disabled = Number(variant.stock) <= 0;

              if (index === 0) select.value = String(variant.id);
              select.appendChild(option);
            });

            // เลือกแบบแรกที่ยังมีสินค้า ถ้ามี
            const availableVariant = productVariants.find(
              v => Number(v.stock) > 0
            );

            if (availableVariant) {
              select.value = String(availableVariant.id);
            }

            select.addEventListener('change', () => {
              const chosen = productVariants.find(
                v => String(v.id) === select.value
              );
              if (chosen) updateDisplay(chosen);
            });

            label.appendChild(select);
            card.appendChild(label);

            const initialVariant = productVariants.find(
              v => String(v.id) === select.value
            ) || productVariants[0];

            updateDisplay(initialVariant);
          } else {
            updateDisplay(null);
          }

          card.appendChild(price);
          card.appendChild(stock);
          productsBox.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        statusBox.textContent =
          'โหลดสินค้าไม่สำเร็จ: ' + (error.message || String(error));
      }
    }

    loadProducts();
  </script>
</body>
</html>
